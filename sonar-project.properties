sonar.projectKey=paperweight
sonar.projectName=Paperweight
sonar.host.url=http://localhost:9000
sonar.sourceEncoding=UTF-8

sonar.sources=src,analysis/src,analysis/scripts,scripts,website/src
sonar.tests=src,test,analysis/test
sonar.test.inclusions=**/*.test.*,**/*.spec.*,test/**,analysis/test/**
sonar.exclusions=**/*.test.*,**/*.spec.*,**/node_modules/**,**/dist/**,**/out/**,**/.next/**,**/coverage/**

# Generate both app and analysis engine coverage with: yarn test:coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info,analysis/coverage/lcov.info
